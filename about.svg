  <rect x="502" y="186" width="150" height="42" rx="13" fill="#ffffff" opacity="0.045" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="577" y="209" text-anchor="middle" fill="#d67964" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Spatial AI</text>
  <text x="577" y="226" text-anchor="middle" fill="#8b98a5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" letter-spacing="1.5">AI</text>
  <rect x="666" y="186" width="94" height="42" rx="13" fill="#ffffff" opacity="0.045" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="713" y="209" text-anchor="middle" fill="#5bfcc4" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700">OSS</text>
