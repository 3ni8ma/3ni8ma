<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260">
<defs>
  <filter id="shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
    <stop offset="28%" stop-color="#ffffff" stop-opacity="0.06"/>
    <stop offset="52%" stop-color="#00f2fe" stop-opacity="0.30"/>
    <stop offset="72%" stop-color="#ffffff" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
  </linearGradient>
  <radialGradient id="cyan-glow" cx="8%" cy="0%" r="130%">
    <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.12"/>
    <stop offset="42%" stop-color="#00f2fe" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="crimson-glow" cx="92%" cy="100%" r="120%">
    <stop offset="0%" stop-color="#e60049" stop-opacity="0.10"/>
    <stop offset="48%" stop-color="#e60049" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#141c25"/>
    <stop offset="100%" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="bottom-wash" x1="0%" y1="100%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#7fb2ff" stop-opacity="0.10"/>
    <stop offset="55%" stop-color="#7fb2ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect x="10" y="14" width="780" height="238" rx="22" fill="#000000" opacity="0.4" filter="url(#shadow-blur)"/>
<rect x="1.5" y="1.5" width="797" height="257" rx="19" fill="none" stroke="url(#border-grad)" stroke-width="1.5"/>
<rect x="3" y="3" width="794" height="254" rx="18" fill="url(#fill-grad)"/>
<rect x="3" y="3" width="794" height="254" rx="18" fill="url(#cyan-glow)"/>
<rect x="3" y="3" width="794" height="254" rx="18" fill="url(#crimson-glow)"/>
<rect x="3" y="3" width="794" height="254" rx="18" fill="url(#bottom-wash)"/>
<rect x="3" y="3" width="794" height="1.5" fill="#ffffff" opacity="0.14"/>

<text x="40" y="52" fill="#00f2fe" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="3">ABOUT ME</text>
<text x="40" y="86" fill="#c8d2dc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15">Building the future of human-computer interaction through spatial computing,</text>
<text x="40" y="108" fill="#c8d2dc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15">full-stack development, and open-source tooling. Founder of The Coder Bros —</text>
<text x="40" y="130" fill="#c8d2dc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15">teaching 1000+ students to build for the web and beyond.</text>
<text x="40" y="162" fill="#8b98a5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">Greater Toronto Area · Platform Engineer @ Hack Club (Stardance)</text>
  <rect x="40" y="186" width="150" height="42" rx="13" fill="#ffffff" opacity="0.045" stroke="#ffffff" stroke-opacity="0.14"/>
