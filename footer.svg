<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150">
<defs>
  <filter id="shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
    <stop offset="28%" stop-color="#ffffff" stop-opacity="0.06"/>
    <stop offset="52%" stop-color="#00f2fe" stop-opacity="0.30"/>
    <stop offset="72%" stop-color="#ffffff" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
  </linearGradient>
  <radialGradient id="cyan-glow" cx="8%" cy="0%" r="130%">
    <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.10"/>
    <stop offset="42%" stop-color="#00f2fe" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#141c25"/>
    <stop offset="100%" stop-color="#0d1117"/>
  </linearGradient>
</defs>

<rect x="8" y="10" width="784" height="132" rx="20" fill="#000000" opacity="0.38" filter="url(#shadow-blur)"/>

<rect x="1.5" y="1.5" width="797" height="147" rx="19" fill="none" stroke="url(#border-grad)" stroke-width="1.5"/>
<rect x="3" y="3" width="794" height="144" rx="18" fill="url(#fill-grad)"/>
<rect x="3" y="3" width="794" height="144" rx="18" fill="url(#cyan-glow)"/>
<rect x="3" y="3" width="794" height="1.5" fill="#ffffff" opacity="0.14"/>

<text x="400" y="68" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700">Let's build something extraordinary together</text>
<text x="400" y="96" text-anchor="middle" fill="#8b98a5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" letter-spacing="3">OPEN SOURCE · SPATIAL COMPUTING · THE CODER BROS</text>
<circle cx="330" cy="120" r="2.5" fill="#00f2fe"/>
<circle cx="400" cy="120" r="2.5" fill="#e60049"/>
<circle cx="470" cy="120" r="2.5" fill="#d67964"/>
</svg>
